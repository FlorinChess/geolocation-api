<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Image Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            overflow: auto;
        }

        #image-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100vw;
            height: 100vh;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
        }

        #menu-container {
            z-index: 20;
            position: absolute;
            background: transparent;
            display: flex;
            margin-top: 10px;
            transition: transform 0.4s ease;

        }

        #input-container {
            flex: auto;
            padding: 2px 16px;
            background-color: white;
            border-bottom-right-radius: 5px;
        }

        #close-button-container {
            flex: auto;
            display: flex;
            flex-direction: column;
        }

        #close-button-ledge {
            flex: 0 0 auto;
            background: white;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;
        }

        .input-container-item {
            display: list-item;
            list-style: none;
            margin: 8px 0 0 0;
            text-align: left;
        }

        input {
            float: right;
            display: inline;
            max-inline-size: 80px;
            margin-left: 10px;
        }

        #close-button {
            width: 30px;
            height: 30px;
            background: transparent;
            border: 0;
            border-radius: 5px;
            display: inline;
            font-size: 22px;
            justify-content: center;
            transition: transform 0.4s ease;
        }
    </style>
</head>
<body>
    <div id="menu-container">
        <div id="input-container">
            <div class="input-container-item"><h3 style="display: inline">Coordinates: </h3></div>
            <div class="input-container-item"><label for="latInput">Latitude  </label><input id="latInput" /></div>
            <div class="input-container-item"><label for="lonInput">Longitude </label><input id="lonInput" /></div>
            <div class="input-container-item"><label for="zoomInput">Zoom: </label><input id="zoomInput" type="number" min="0" max="18" value="15" /></div>
            <div class="input-container-item"><button id="search-button" onclick="fetchImages()">Search</button></div>
        </div>
        <div id="close-button-container">
            <div id="close-button-ledge">
                <div style="transform: rotate(180deg)">
                    <button id="close-button" onclick="closeButtonClicked()">
                        &#5171;
                    </button> <!-- &#x2715; -->
                </div>
            </div>
            <div style="background: transparent; flex: 1"></div>
        </div>
    </div>
    <div id="image-grid"></div>
<script>
    let menuOpen = true;
    let apiUrl = 'http://localhost:8010/tile/';  // Replace with your API URL

    function closeButtonClicked() {
        if (menuOpen === true) {
            closeMenu();
        } else {
            openMenu();
        }
    }

    function closeMenu() {
        const menuContainer = document.getElementById("menu-container");
        const closeButton = document.getElementById("close-button");

        menuContainer.style.transform = `translateX(${closeButton.offsetWidth - menuContainer.offsetWidth}px)`;
        closeButton.style.transform = `rotate(180deg)`;
        menuOpen = false;
    }

    function openMenu() {
        const menuContainer = document.getElementById("menu-container");
        const closeButton = document.getElementById("close-button");

        menuContainer.style.transform = `translateX(0px)`;
        closeButton.style.transform =  `rotate(0deg)`;
        menuOpen = true;
    }

    async function fetchImages() {
        // disable fetch button and change its text to indicate loading
        const button = document.getElementById('search-button');
        button.innerText = "Loading...";
        button.disabled = true;

        const grid = document.getElementById('image-grid');
        grid.innerHTML = '';  // Clear the grid

        let latitude = parseFloat(document.getElementById("latInput").value);
        let latitude_radians = latitude * Math.PI / 180;
        let longitude = parseFloat(document.getElementById("lonInput").value);
        let zoom = parseFloat(document.getElementById("zoomInput").value);

        // compute starting point based on zoom

        // https://wiki.openstreetmap.org/wiki/Slippy_map_tilenames#Java
        let n = Math.pow(2, zoom);

        // floor to get the integer part
        let x_starting_tile = Math.floor(n * ((longitude + 180) / 360));
        let y_starting_tile = Math.floor(n * (1 - (Math.log(Math.tan(latitude_radians) + (1 / Math.cos(latitude_radians))) / Math.PI)) / 2);


        let elements_per_row = 8;
        let row_count = 4;

        // shift the desired position to the center of the window
        let x = x_starting_tile - 4;
        let y = y_starting_tile - 1;

        for (let row = 0; row < row_count; row++) {
            for (let column = 0; column < elements_per_row; column++) {
                try {
                    const imageData = await fetchImage(x + column, y + row, zoom);  // Fetch one image
                    const imgElement = document.createElement('img');

                    imgElement.src = imageData;

                    const gridItem = document.createElement('div');
                    gridItem.classList.add('grid-item');
                    gridItem.appendChild(imgElement);

                    grid.appendChild(gridItem);
                } catch (error) {
                    console.error('Error fetching image:', error);
                }
            }
        }

        // reset button
        button.innerText = "Search"
        button.disabled = false;
    }

    // Function to fetch a single image and return it as a base64 data URL
    async function fetchImage(x, y, zoom) {
        let url = apiUrl.concat(zoom, "/", x, "/", y, ".png?layers=water,residential,commercial,education,industrial,vineyard,grass,meadow,flowerbed,cemetery,garden,park,greenfield,pitch,stadium,sports_centre,track,forest,wood,farmland,farmyard,motorway,trunk,road,secondary,primary,railway,building,recreation_ground,village_green,garages,playground");
        console.log(url);
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error('Failed to fetch image');
        }

        const blob = await response.blob();  // Get the image as a Blob
        return convertBlobToBase64(blob);    // Convert Blob to base64 string
    }

    // Function to convert a Blob to a base64 data URL
    function convertBlobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }
</script>

</body>
</html>
